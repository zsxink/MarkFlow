<svg width="660" height="400" viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg">
  <!--
    MarkFlow DMG 安装窗口背景（设计源，1×）
    画布尺寸必须等于 tauri.conf.json 的 bundle.macOS.dmg.windowSize。
    注意：Finder 的 background picture 不做 DPI 缩放，因此只出 1× 图。

    坐标契约（改动前先读 design.md Decision 2 / 7）：
      图标中心  app(180,170)  Applications(480,170)  图标 128pt
      安全区    x∈[116,244] ∪ [416,544]，y∈[106,256]（图标本体 + 下方 label 占位）
      本文件所有元素必须避开安全区。
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F4"/>
      <stop offset="0.58" stop-color="#F7F2EC"/>
      <stop offset="1" stop-color="#F1EAE2"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.76"/>
      <stop offset="0.72" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="0.7" fill="#8D7867" opacity="0.07"/>
      <circle cx="16" cy="14" r="0.55" fill="#8D7867" opacity="0.055"/>
      <circle cx="22" cy="3" r="0.4" fill="#8D7867" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="660" height="400" fill="url(#paper)"/>
  <rect width="660" height="400" fill="url(#halo)"/>
  <rect width="660" height="400" fill="url(#grain)"/>

  <!-- 两侧的编辑器纸张暗纹：增加层次，但避开 Finder 图标安全区 -->
  <g fill="none" stroke="#BE4A29" stroke-linecap="round">
    <g opacity="0.14" stroke-width="2">
      <path d="M42 126h42M42 138h30M42 150h36M42 162h26"/>
      <path d="M576 126h42M588 138h30M582 150h36M592 162h26"/>
    </g>
    <g opacity="0.10" stroke-width="1">
      <rect x="32" y="108" width="72" height="78" rx="10"/>
      <rect x="556" y="108" width="72" height="78" rx="10"/>
    </g>
  </g>

  <!-- 顶部品牌标识 -->
  <g transform="translate(245 29)">
    <rect width="28" height="28" rx="8" fill="#BE4A29"/>
    <path d="M7 9.5v10l7-5.1 7 5.1v-10" fill="none" stroke="#FFF9F4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M7.5 23h13" stroke="#F4AD8F" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="283" y="49" font-family="Helvetica Neue, Helvetica, PingFang SC, Arial, sans-serif"
        font-size="20" font-weight="700" letter-spacing="0.3"><tspan fill="#2A2522">Mark</tspan><tspan fill="#BE4A29">Flow</tspan></text>
  <text x="330" y="76" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Arial, sans-serif"
        font-size="10" font-weight="600" letter-spacing="2.2" fill="#8D7867">WRITE · THINK · FLOW</text>

  <!--
    拖拽指示箭头。
    y=170 与两处图标中心严格同高：Finder 内容区原点相对窗口的偏移量存在不确定性，
    锁定同一水平线可让构图对该偏移免疫（即便整体上下偏移，箭头仍与图标对齐）。
    跨度 x∈[262,402] 落在中间可用区 [244,416] 内。
  -->
  <path d="M262 170 H378" stroke="#BE4A29" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M378 157 L402 170 L378 183 Z" fill="#BE4A29"/>
  <circle cx="262" cy="170" r="4" fill="#F7F2EC" stroke="#BE4A29" stroke-width="2"/>

  <!-- 中间轻量提示，帮助用户理解箭头动作 -->
  <text x="330" y="218" text-anchor="middle" font-family="Helvetica Neue, Helvetica, PingFang SC, Arial, sans-serif"
        font-size="10" font-weight="600" letter-spacing="1.6" fill="#A08B7A">INSTALL IN ONE STEP</text>

  <!-- 安装指引（y=316 在图标安全区下方，不与之冲突） -->
  <g transform="translate(190 286)">
    <rect width="280" height="54" rx="27" fill="#FFFDF9" fill-opacity="0.82" stroke="#E7DCD1"/>
    <circle cx="28" cy="27" r="15" fill="#F4E4D9"/>
    <path d="M28 19v15M22 29l6 6 6-6M22 23h12" fill="none" stroke="#BE4A29" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="24" font-family="Helvetica Neue, Helvetica, PingFang SC, Arial, sans-serif"
          font-size="13" font-weight="600" fill="#3B332E">拖入 Applications</text>
    <text x="52" y="40" font-family="Helvetica Neue, Helvetica, PingFang SC, Arial, sans-serif"
          font-size="10" fill="#8D7867">完成安装，开始写作</text>
  </g>
</svg>
