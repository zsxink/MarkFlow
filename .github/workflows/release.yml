name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MarkFlow ${{ github.ref_name }}
          releaseBody: |
            ## MarkFlow ${{ github.ref_name }}

            ### 下载说明
            - **Windows**: 下载 `.exe` 文件运行安装
            - **macOS**: 下载 `_aarch64.dmg` 文件，将 MarkFlow 拖入 Applications
            - **Linux**: 下载 `.AppImage` 或 `.deb` 文件安装

            ### Homebrew (macOS)
            ```bash
            brew install zsxink/tap/markflow
            ```
          releaseDraft: true
          prerelease: false

      # DMG 外观收尾。Tauri 的 AppleScript 段对 iconSize / arrangeBy 不可靠——实测两项都没落地，
      # 而 DmgConfig 里根本没有对应字段，配置层面改不了。所以构建后补一次字节级归一化，
      # 再对**产物本身**断言（而不是看打包日志）。断言失败让 job 失败，配合 releaseDraft: true
      # 保证有问题的草稿不会被发布。
      - name: Normalize DMG appearance
        if: matrix.platform == 'macos-latest'
        run: |
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            node scripts/style-dmg.mjs "$dmg"
          done

      - name: Verify DMG appearance
        if: matrix.platform == 'macos-latest'
        run: |
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            node scripts/verify-dmg-appearance.mjs "$dmg"
          done

      - name: Re-upload normalized DMG
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            gh release upload "${{ github.ref_name }}" "$dmg" --clobber
          done

  # Publish updated formula to zsxink/homebrew-tap on each release
  homebrew:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to Homebrew tap
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          chmod +x ./scripts/homebrew-publish.sh
          ./scripts/homebrew-publish.sh "${{ github.ref_name }}"
